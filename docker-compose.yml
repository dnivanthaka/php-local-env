services:
  app:
    build:
      context: .                  # Look inside local-env for the Dockerfile
      dockerfile: backend.Dockerfile
    volumes:
      - ../backend:/var/www/html  # Map to the external peer backend directory
    networks:
      - laravel-network

  web:
    build:
      context: .
      dockerfile: web.Dockerfile
    ports:
      - "8080:80"
    volumes:
      # Ensure your local backend code is mapped inside Nginx exactly like the app container
      - ../backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel-network


  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - laravel-network

  redis:
    image: redis:alpine
    networks:
      - laravel-network

  queue:
    build:
      context: .
      dockerfile: backend.Dockerfile
    command: php artisan queue:work redis --sleep=3 --tries=3
    volumes:
      - ../backend:/var/www/html
    depends_on:
      - app
      - redis
    networks:
      - laravel-network

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - laravel-network

  minio:
    image: pgsty/silo:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: password
    command: server /data --console-address ":9001"
    networks:
      - laravel-network

networks:
  laravel-network:
    driver: bridge

volumes:
  db-data:
  minio-data:
